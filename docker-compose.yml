services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"  # host port from .env (5434; 5432 and 5433 are taken locally)
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
